[project]
name = "dz6-it-school"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<3",
    "turso-serverless>=0.1.0,<0.2",
    "openai>=2,<3",
    "argon2-cffi>=23,<26",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "tzdata>=2025.1",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npx --yes pnpm@10 --dir frontend install --frozen-lockfile && npx --yes pnpm@10 --dir frontend build"
